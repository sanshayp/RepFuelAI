<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="rfOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#FF3D00" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="48" height="48" rx="12" fill="#0F0F11" />
  <!-- Stylized Dumbbell + Energy Bolt -->
  <g transform="translate(8, 8)" filter="url(#glow)">
    <!-- Dumbbell left plate -->
    <rect x="2" y="9" width="4" height="14" rx="2" fill="url(#rfOrange)" />
    <rect x="7" y="11" width="2" height="10" rx="1" fill="#FFFFFF" opacity="0.8" />
    <!-- Dumbbell bar -->
    <rect x="9" y="14" width="14" height="4" rx="2" fill="#FFFFFF" />
    <!-- Dumbbell right plate -->
    <rect x="23" y="11" width="2" height="10" rx="1" fill="#FFFFFF" opacity="0.8" />
    <rect x="26" y="9" width="4" height="14" rx="2" fill="url(#rfOrange)" />
    <!-- Energy Spark / Rep Pulse -->
    <path d="M17 6L14 16H18L15 26L22 14H18L21 6Z" fill="#00F59B" opacity="0.9" />
  </g>
</svg>
